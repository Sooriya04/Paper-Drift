name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Build & Smoke Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Cache Benchmark PDFs (Zero Git Bloat)
        uses: actions/cache@v4
        with:
          path: test/fixtures/benchmarks
          key: benchmark-pdfs-${{ hashFiles('test/scripts/benchmark-papers.js') }}

      - name: Run Test Suite
        run: npm test

      - name: Benchmark Landmark ArXiv Papers
        run: npm run benchmark

      - name: Upload Test Results & Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-drift-results-node-${{ matrix.node-version }}
          path: test/results/
          retention-days: 7
